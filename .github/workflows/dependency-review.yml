name: Dependency review

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # GreenCI ships its dependency closure inside the Action bundle, so a
          # moderate advisory in a runtime dependency is worth blocking on.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Copyleft licences would change the terms under which the bundled
          # distribution can be redistributed.
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later
