name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Strict type check
        run: pnpm typecheck

      - name: Verify version consistency
        run: pnpm versions:verify

      - name: Verify dataset manifest and embedded copy
        run: pnpm data:verify

      - name: Verify published JSON Schemas
        run: pnpm schemas:verify

      - name: Unit, property, and security tests with coverage
        run: pnpm test:coverage

      - name: Build the Action bundle
        run: pnpm bundle

      - name: Verify the committed distribution byte for byte
        run: pnpm verify:dist

      - name: Reproduce the offline demonstration
        run: pnpm demo

      - name: Benchmark the analysis engine
        run: pnpm benchmark

      - name: Generate the software bill of materials
        run: pnpm sbom:generate --out greenci-sbom.json

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}
          path: |
            coverage/coverage-summary.json
            greenci-sbom.json
          retention-days: 7
          if-no-files-found: warn
