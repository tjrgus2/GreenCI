name: GreenCI
description: Analyze GitHub Actions runtime and current-run CI efficiency
author: GreenCI Contributors

branding:
  icon: activity
  color: green

inputs:
  github-token:
    description: GitHub token used to read Actions data
    required: true
  config-path:
    description: Repository-relative path to GreenCI configuration
    required: false
    default: .greenci.yml
  locale:
    description: >-
      Report locale, en or ko. Leave empty to use .greenci.yml, then the
      bundled default (en).
    required: false
    default: ''
  baseline-runs:
    description: >-
      Number of successful base-branch runs to compare. Leave empty to use
      .greenci.yml, then the bundled default (7).
    required: false
    default: ''
  parse-failure-logs:
    description: Parse bounded failed-job logs locally
    required: false
    default: 'false'
  upload-report-artifact:
    description: Upload greenci-report.json as an artifact
    required: false
    default: 'true'

outputs:
  report-path:
    description: Path to greenci-report.json
  runner-seconds:
    description: Total analyzed runner time in seconds
  carbon-p50-grams:
    description: Median estimated operational emissions
  carbon-p95-grams:
    description: p95 estimated operational emissions
  list-price-usd:
    description: Estimated gross list-price equivalent
  policy-conclusion:
    description: pass, warn, fail, or skipped
  critical-path-seconds:
    description: Total duration of the analyzed critical path
  recommendation-count:
    description: Number of recommendations that met the confidence threshold

runs:
  using: node24
  main: packages/github-action/dist/index.js
